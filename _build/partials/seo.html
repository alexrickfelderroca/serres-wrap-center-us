{{!--
  REGION:seo — the whole head SEO block (spec 8.2). Values come from
  _build/data/seo.json with pricing.js tokens already resolved.
  Syntax: see header.html.
--}}
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="{{robots}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="{{ogType}}">
<meta property="og:site_name" content="{{siteName}}">
<meta property="og:locale" content="{{locale}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
{{#if isArticle}}<meta property="article:published_time" content="{{published}}">
<meta property="article:modified_time" content="{{modified}}">
{{/if}}<meta name="twitter:card" content="{{twitterCard}}">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{ogImage}}">
